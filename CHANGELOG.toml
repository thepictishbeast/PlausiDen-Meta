# Doctrine + engine changelog for PlausiDen-Meta.
#
# Required by PlausiDen-Meta/OPERATING_PRINCIPLES.md §11 (doctrines-are-living).
# Consumer CI pulls this on every audit run; warns at 30 days behind, fails at
# 90 days behind.
#
# Append-only. Newest entries at the top.
# Each entry covers either a doctrine version bump (semver: major = removed
# tenet / added tenet / precedence change; minor = added anti-pattern /
# vocabulary field / taxonomy entry; patch = wording / examples / typos)
# or an engine version bump (semver per the engine's own versioning).

[meta]
repo                = "PlausiDen-Meta"
last_amendment_date = "2026-06-18T18:05:00Z"
amendment_count     = 2

# === Entries ===
# Format:
#   [[entry]]
#   id              = "<doctrine-or-engine-version-id>"
#   kind            = "doctrine" | "engine" | "amendment" | "deprecation"
#   version_from    = "<semver>"
#   version_to      = "<semver>"
#   date            = "<ISO-8601>"
#   summary         = "<one-line>"
#   affected_tenets = ["<tenet-id>", ...]   # for doctrine entries
#   amendment_pr    = "<URL>"               # for amendment entries
#   notes           = "<optional>"

[[entry]]
id              = "meta-doctrine-1.2.0"
kind            = "doctrine"
version_from    = "1.1.0"
version_to      = "1.2.0"
date            = "2026-06-18T18:05:00Z"
summary         = "Expand STACK_DOCTRINE.md to r4: per-layer Primary-vs-Fallback rationale + migration paths (in collapsibles); new How-to-choose decision heuristic, interop-spine, and anti-patterns sections; new Layer 16 (cross-cutting infrastructure: serialization/messaging/search/caching/observability/API-contracts). All r3 picks/flags/stances preserved."
affected_tenets = ["stack-doctrine", "language-selection"]
notes           = "Adversarially integrity-checked before commit: invented version/date specifics stripped (Mojo/OpenTofu/Redis/ES/Grafana years + versions); protobuf corrected to BSD-3-Clause; all 27 internal anchors resolve; <details> balanced. Flagged license-class claims (RabbitMQ/Redpanda/Dragonfly/Meilisearch/Lean/CBOR) stated qualitatively — re-verify quarterly."

[[entry]]
id              = "meta-doctrine-1.1.0"
kind            = "doctrine"
version_from    = "1.0.0"
version_to      = "1.1.0"
date            = "2026-06-18T17:15:00Z"
summary         = "Add STACK_DOCTRINE.md (The Sovereign Polyglot Stack) — best-language-per-domain reference + language-selection doctrine; the which-tool leg next to SECURITY_BASELINE and SUPERSOCIETY_BASELINE."
affected_tenets = ["stack-doctrine", "language-selection", "governance-as-selection-axis"]
notes           = "Pre-existing standalone doc (2026.05-r2) imported, expanded to r3 with layer index, how-to-use, PlausiDen ecosystem mapping, and doctrine cross-refs; wired into README, ECOSYSTEM_GUIDE (Language coverage), QUICKSTART preamble. Cross-linked with PlausiDen-AI/docs/SUPERSOCIETY_STACK.md. Advisory, not a gate."
